<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aju Util</title>
  <meta name="description" content="Utilidades para Aracaju e Grande Aracaju — emergência, serviços, saúde e mais. Funciona offline.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c0392b">
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --text: #f5f5f5;
      --muted: #aaa;
      --accent: #e74c3c;
      --border: #2a2a2a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
    }
    header {
      padding: 20px 16px 10px;
      background: linear-gradient(180deg, #1a1a1a, var(--bg));
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { margin: 0; font-size: 1.6rem; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .search {
      width: 100%;
      margin: 12px 0;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    .chips {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 0 12px;
      -webkit-overflow-scrolling: touch;
    }
    .chip {
      flex: 0 0 auto;
      background: #2c1818;
      color: var(--accent);
      border: 1px solid #5a2a2a;
      border-radius: 20px;
      padding: 10px 16px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .section { padding: 0 16px 20px; }
    .section h2 { font-size: 1.1rem; margin: 16px 0 8px; color: var(--muted); }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .card h3 { margin: 0 0 4px; font-size: 1rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.85rem; }
    .phone { color: var(--accent); font-weight: 600; margin-top: 6px; display: inline-block; }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.75rem;
      text-align: center;
    }
    nav a.active { color: var(--accent); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Aju Util</h1>
    <div class="subtitle">Aracaju e Grande Aracaju — no seu navegador</div>
    <input class="search" id="search" placeholder="Buscar (SAMU, Procon, orla…)" oninput="filterItems()">
    <div class="chips" id="emergency-chips"></div>
  </header>

  <div id="content"></div>

  <nav>
    <a href="#" onclick="showView('home'); return false;" class="active" id="nav-home">Início</a>
    <a href="#" onclick="showView('emergency'); return false;" id="nav-emergency">Emergência</a>
    <a href="#" onclick="showView('favorites'); return false;" id="nav-favorites">Favoritos</a>
    <a href="#" onclick="showView('tips'); return false;" id="nav-tips">Dicas</a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
